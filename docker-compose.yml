services:
  # Servicio 1: API REST de Inferencia (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somnoscope-api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Servicio 2: Tablero Clínico Interactivo (Streamlit)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somnoscope-dashboard
    command: streamlit run app/dashboard.py --server.port 8050 --server.address 0.0.0.0 --server.headless true
    environment:
      - API_URL=http://api:8000
    ports:
      - "8050:8050"
    depends_on:
      - api
    restart: unless-stopped

  # Servicio 3: Servidor de Seguimiento de Experimentos (MLflow)
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somnoscope-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////data/mlflow.db --default-artifact-root /data/mlruns --allowed-hosts "*" --cors-allowed-origins "*"
    volumes:
      - mlflow_data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  mlflow_data:
